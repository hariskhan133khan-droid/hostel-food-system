<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostel Food System</title>
<style>
body{ font-family:Arial; background:#f4f4f4; padding:20px; }
h2{ text-align:center; margin-bottom:5px; }
.subtitle{ text-align:center; color:#888; font-size:13px; margin-bottom:15px; }

.top-bar{
  display:flex; justify-content:space-between;
  align-items:center; margin-bottom:15px;
  flex-wrap:wrap; gap:8px;
}
.top-bar button{
  padding:10px 14px; border:none; color:white;
  border-radius:6px; cursor:pointer; font-weight:bold;
}
.left-btn{ background:#e74c3c; }
.right-btn{ background:#3498db; }
.logout-btn{ background:#7f8c8d; font-size:13px; }

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.card{
  background:white; padding:15px;
  border-radius:12px; text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}
.card img{
  width:80px; height:80px; border-radius:50%;
  object-fit:cover; margin-bottom:8px;
}
input[type="number"]{
  width:80%; padding:8px;
  border:1px solid #ccc; border-radius:6px;
}
.status{ font-weight:bold; }
.red{ color:red; }
.green{ color:green; }

.box{
  margin-top:20px; background:white;
  padding:15px; border-radius:10px; font-weight:bold;
}
#expenseInput{
  width:150px; padding:8px;
  border-radius:6px; border:1px solid #ccc;
}
button{
  padding:8px 12px; border:none;
  background:#2ecc71; color:white;
  border-radius:6px; cursor:pointer; margin-left:8px;
}
.history{
  margin-top:10px; background:white;
  padding:10px; border-radius:10px;
}
.balance-box{
  margin-top:10px; background:white;
  padding:15px; border-radius:10px;
  font-weight:bold; border-left:4px solid #2ecc71;
}
.balance-positive{ color:#27ae60; }
.balance-negative{ color:#e74c3c; }

/* Loading spinner */
.loading{
  text-align:center; padding:30px;
  color:#888; font-size:14px;
}
.save-indicator{
  font-size:11px; color:#27ae60;
  margin-top:4px; min-height:16px;
}

@media(max-width:600px){
  .grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<h2>🍽️ Hostel Food System</h2>
<p class="subtitle">خوش آمدید! آج کا دن اچھا گزرے</p>

<div class="top-bar">
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="left-btn" onclick="resetPaid()">🔴 Reset Total Paid</button>
    <button class="right-btn" onclick="resetHistory()">🟢 Reset History</button>
    <a href="node.html"><button style="background:#9b59b6;">📝 Open Notepad</button></a>
  </div>
  <button class="logout-btn" onclick="doLogout()">🚪 Logout</button>
</div>

<!-- MEMBERS GRID -->
<div class="grid" id="membersGrid">
  <div class="loading" style="grid-column:1/-1">⏳ Members load ho rahe hain...</div>
</div>

<!-- TOTAL -->
<div class="box">
  💰 Total Paid: <span id="paid">0</span> Rs &nbsp;|&nbsp;
  🛒 Spent Money: <span id="expense">0</span> Rs
</div>

<!-- BALANCE -->
<div class="balance-box">
  Balance: <span id="balance" class="balance-positive">0</span> Rs
</div>

<!-- EXPENSE -->
<div class="box">
  <h3>➕ Add Spent Money</h3>
  <input id="expenseInput" type="number" placeholder="خرچہ ڈالیں">
  <input id="expenseNote" type="text" placeholder="Note (optional)" style="width:130px;padding:8px;border-radius:6px;border:1px solid #ccc;">
  <button onclick="addExpense()">Add</button>
</div>

<!-- HISTORY -->
<div class="history">
  <h3>📋 History</h3>
  <ul id="historyList"></ul>
</div>

<script>
const API = 'http://localhost:3000/api';

// ─── Load members from backend ───────────────────────
async function loadMembers() {
  try {
    const res = await fetch(`${API}/members`);
    const members = await res.json();
    renderMembers(members);
  } catch(e) {
    document.getElementById('membersGrid').innerHTML =
      `<div class="loading" style="grid-column:1/-1;color:red;">
        ❌ Server se connect nahi hua!<br>
        <small>Make sure server chal raha hai: node server.js</small>
      </div>`;
  }
}

// ─── Render member cards ─────────────────────────────
function renderMembers(members) {
  const grid = document.getElementById('membersGrid');
  grid.innerHTML = '';
  members.forEach(m => {
    const fallback = `https://ui-avatars.com/api/?name=${m.name}&background=3498db&color=fff&size=80`;
    grid.innerHTML += `
      <div class="card">
        <img src="${m.image_url || fallback}"
             onerror="this.src='${fallback}'">
        <h3>${m.name}</h3>
        <input type="number" id="${m.name.toLowerCase()}"
               value="${m.paid > 0 ? m.paid : ''}"
               oninput="updateMember('${m.name}', this.value)"
               placeholder="رقم ڈالیں">
        <p id="${m.name.toLowerCase()}Status" class="status ${m.remaining > 0 ? 'red' : 'green'}">
          ${m.remaining > 0 ? 'Remaining: ' + m.remaining : '✔ Paid'}
        </p>
        <p id="${m.name.toLowerCase()}Save" class="save-indicator"></p>
      </div>`;
  });
}

// ─── Update member paid amount ───────────────────────
let saveTimers = {};
async function updateMember(name, value) {
  const paid = Number(value) || 0;
  const remaining = 1500 - paid;
  const key = name.toLowerCase();

  // Update UI instantly
  document.getElementById(key + 'Status').innerText =
    remaining > 0 ? 'Remaining: ' + remaining : '✔ Paid';
  document.getElementById(key + 'Status').className =
    remaining > 0 ? 'status red' : 'status green';
  document.getElementById(key + 'Save').innerText = '💾 saving...';

  // Debounce — save after 800ms
  clearTimeout(saveTimers[name]);
  saveTimers[name] = setTimeout(async () => {
    try {
      await fetch(`${API}/members/${name}/paid`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paid })
      });
      document.getElementById(key + 'Save').innerText = '✅ saved!';
      setTimeout(() => document.getElementById(key + 'Save').innerText = '', 2000);
    } catch(e) {
      document.getElementById(key + 'Save').innerText = '❌ save nahi hua';
    }
    loadSummary();
  }, 800);
}

// ─── Load summary (paid, expense, balance) ───────────
async function loadSummary() {
  try {
    const res = await fetch(`${API}/summary`);
    const data = await res.json();
    document.getElementById('paid').innerText = data.totalPaid;
    document.getElementById('expense').innerText = data.totalExpense;
    const bal = document.getElementById('balance');
    bal.innerText = data.balance;
    bal.className = data.balance >= 0 ? 'balance-positive' : 'balance-negative';
  } catch(e) {}
}

// ─── Load expense history ─────────────────────────────
async function loadHistory() {
  try {
    const res = await fetch(`${API}/expenses`);
    const expenses = await res.json();
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    expenses.forEach(e => {
      const li = document.createElement('li');
      const d = new Date(e.created_at);
      li.innerText = `خرچہ Rs ${e.amount}${e.note ? ' — ' + e.note : ''} — ${d.toLocaleString('ur-PK')}`;
      list.appendChild(li);
    });
  } catch(e) {}
}

// ─── Add expense ─────────────────────────────────────
async function addExpense() {
  const amount = Number(document.getElementById('expenseInput').value);
  const note = document.getElementById('expenseNote').value;
  if (!amount) return;

  try {
    await fetch(`${API}/expenses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, note })
    });
    document.getElementById('expenseInput').value = '';
    document.getElementById('expenseNote').value = '';
    loadHistory();
    loadSummary();
  } catch(e) {
    alert('❌ Expense save nahi hua — server check karo');
  }
}

// ─── Reset paid ──────────────────────────────────────
async function resetPaid() {
  if (!confirm('کیا آپ واقعی Total Paid reset کرنا چاہتے ہیں؟')) return;
  try {
    await fetch(`${API}/members/reset-paid`, { method: 'POST' });
    loadMembers();
    loadSummary();
  } catch(e) {
    alert('❌ Reset nahi hua');
  }
}

// ─── Reset history ───────────────────────────────────
async function resetHistory() {
  if (!confirm('کیا آپ واقعی History reset کرنا چاہتے ہیں؟')) return;
  try {
    await fetch(`${API}/expenses/reset`, { method: 'DELETE' });
    loadHistory();
    loadSummary();
  } catch(e) {
    alert('❌ History reset nahi hua');
  }
}

// ─── Logout ──────────────────────────────────────────
function doLogout() {
  if (confirm('کیا آپ Logout کرنا چاہتے ہیں؟')) {
    window.location.href = 'login.html';
  }
}

// ─── Init ────────────────────────────────────────────
loadMembers();
loadSummary();
loadHistory();
</script>
</body>
</html>
