<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notepad</title>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
}

textarea{
    width:100%;
    height:300px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    padding:10px 15px;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

.save{ background:#2ecc71; }
.clear{ background:red; }
.back{ background:#3498db; }
</style>
</head>

<body>

<div class="container">

<h2> Notepad</h2>

<textarea id="noteArea" placeholder="Write your notes here..."></textarea>

<br>

<button class="save" onclick="saveNote()"> Save</button>
<button class="clear" onclick="clearNote()">Clear</button>

<a href="home.html">
    <button class="back">⬅ Back</button>
</a>

</div>

<script>

// load saved note
window.onload = function(){
    let data = localStorage.getItem("myNote");
    if(data){
        document.getElementById("noteArea").value = data;
    }
};

// save note
function saveNote(){
    let note = document.getElementById("noteArea").value;
    localStorage.setItem("myNote", note);
    alert("Note saved!");
}

// clear note
function clearNote(){
    document.getElementById("noteArea").value = "";
    localStorage.removeItem("myNote");
}

</script>

</body>
</html>
